[project]
name = "visor-agent"
version = "0.0.1"
description = "Visor LLM planner: intent → validated Skill DAG."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visor_agent"]
